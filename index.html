<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2140">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Cashflow & Relief Cukai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone wallet — a deep-blue balance card on top, scannable cards below, a bottom tab bar with a raised "+" for fast entry. */
:root{
  --bg:#efeee9; --surface:#fbfbf8; --ink:#121417; --ink-2:#4d4f55; --muted:#7f8087; --line:#e0dfd8;
  --accent:#1c5cab; --accent-soft:#e2ecf8; --on-accent:#ffffff;
  --hero:#0f2f57; --hero-2:#0a2140; --hero-ink:#f3f6fb; --hero-mut:#a9bbd3; --gold:#f2b632;
  --in:#2a78d6; --out:#eb6834; --good:#00703a; --good-soft:#dcf1e5; --warn:#8a5a00; --warn-soft:#fbefd3; --crit:#c23434;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0d0f; --surface:#17181b; --ink:#f1f1ee; --ink-2:#c5c5bf; --muted:#94948d; --line:#2a2b2f;
    --accent:#5b9cf0; --accent-soft:#16263b; --on-accent:#0b0b0b;
    --hero:#143b6c; --hero-2:#0c2547; --hero-ink:#f3f6fb; --hero-mut:#a9bbd3; --gold:#f5c14d;
    --in:#3987e5; --out:#e06a36; --good:#3fc27a; --good-soft:#12291c; --warn:#f6b52a; --warn-soft:#2c230f; --crit:#ec6b6b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:1.08rem;font-weight:700}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px}
.top .hi{font-size:.8rem;color:var(--muted)}
.top h1{font-size:1.3rem;font-weight:800}
.yr{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:.8rem;color:var(--ink-2)}
.yr select{border:0;background:transparent;font-weight:700;color:var(--ink);padding:4px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:var(--hero-ink);
  background:radial-gradient(120% 140% at 100% 0%, var(--hero) 0%, var(--hero-2) 70%)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 30px rgba(255,255,255,.03),0 0 0 60px rgba(255,255,255,.02)}
.hero .lab{font-size:.78rem;color:var(--hero-mut);letter-spacing:.02em}
.hero .bal{font-family:var(--display);font-weight:800;font-size:2.35rem;line-height:1.05;margin:4px 0 16px;letter-spacing:-.02em}
.hero .bal small{font-size:1.1rem;font-weight:600;color:var(--hero-mut);margin-right:2px}
.hero .flows{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.flow{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px}
.flow .k{font-size:.74rem;color:var(--hero-mut);display:flex;align-items:center;gap:6px}
.flow .v{font-family:var(--display);font-weight:700;font-size:1.05rem;margin-top:2px}
.flow .ar{width:18px;height:18px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.hero .rel{margin-top:14px;position:relative;z-index:1}
.hero .rel .row{display:flex;justify-content:space-between;font-size:.78rem;color:var(--hero-mut)}
.hero .rel .row b{color:var(--hero-ink);font-weight:600}
.hero .bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:6px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}

.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.card-h small{color:var(--muted);font-size:.78rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer}
.tile .k{font-size:.76rem;color:var(--ink-2)}
.tile .v{font-family:var(--display);font-weight:800;font-size:1.35rem;margin-top:2px}
.tile .s{font-size:.74rem;color:var(--muted);margin-top:2px}
.sub{color:var(--muted);font-size:.8rem}
.note{font-size:.8rem;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:.76rem;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.85rem;margin-bottom:10px}
.hbar .track{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--out);border-radius:4px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--line);color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:6px 10px;font-size:.8rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;cursor:pointer;font-size:.85rem}

/* list */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.8rem;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.month{margin:18px 0 6px;display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-2);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.tx:first-child{border-top:0}
.tx:hover{background:var(--bg)}
.av{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:.95rem}
.av.out{background:#fde7dc;color:#a23c12}
.av.in{background:#dfeafb;color:#1b4f93}
.av.ded{background:var(--line);color:var(--ink-2)}
@media (prefers-color-scheme: dark){ .av.out{background:#3a2015;color:#f3a37d} .av.in{background:#15263d;color:#8dbaf2} }
.tx .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:.74rem;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap;text-align:right}
.amt.in{color:var(--in)}
.amt small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.steps{margin:8px 0 0;padding-left:18px;color:var(--ink-2);font-size:.9rem}
.steps li{margin:5px 0}

/* tax */
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:.9rem}
.calc .k{color:var(--ink-2)}
.calc .v{text-align:right}
.calc .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.calc .tot{font-weight:700;font-family:var(--display);font-size:1.05rem}
.result{margin-top:12px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.result.pay{background:var(--warn-soft);color:var(--warn)}
.result.refund{background:var(--good-soft);color:var(--good)}
.result b{font-family:var(--display);font-size:1.35rem;font-weight:800}
.relr{padding:12px 0;border-top:1px solid var(--line)}
.relr:first-of-type{border-top:0}
.relr .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.relr .nm{font-weight:500}
.relr .am{text-align:right;white-space:nowrap;font-size:.84rem;color:var(--ink-2)}
.relr .am b{font-size:.95rem;color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog i.full{background:var(--good)}
.relr .hint{font-size:.77rem;color:var(--muted);margin-top:6px}
.relr .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.subrel{margin:8px 0 0 10px;padding-left:10px;border-left:2px solid var(--line)}
.subrel .relr{padding:8px 0}
.items{margin-top:8px;font-size:.82rem}
.items button{display:flex;justify-content:space-between;width:100%;gap:8px;border:0;background:none;padding:6px 0;cursor:pointer;color:var(--ink-2);text-align:left}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set label,.set>span:first-child{flex:1}
.set .sub{display:block}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.stepper output{min-width:20px;text-align:center;font-weight:600}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.ebe{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px 10px;align-items:center;font-size:.88rem}
.ebe .k{color:var(--ink-2)}
.ebe .v{text-align:right;font-weight:600}
.ebe .h{grid-column:1/-1;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-top:10px}
.ebe .h:first-child{margin-top:0}
.ebe .w{grid-column:1/-1;color:var(--ink-2)}
.cp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:.74rem;cursor:pointer}

/* receipts */
.keep{display:flex;gap:12px;align-items:center}
.keep b{font-family:var(--display);font-size:1.2rem;font-weight:800}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.th{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);cursor:pointer;padding:0;text-align:left;display:flex;flex-direction:column}
.th .im{width:100%;aspect-ratio:1/1;background:var(--line) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;color:var(--muted);font-size:.9rem}
.th span{font-size:.7rem;padding:5px 7px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.88rem}
.docrow:first-child{border-top:0}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline select,.inline input[type=text],.inline input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px}
.links{display:flex;gap:8px;flex-wrap:wrap}

/* bottom nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav.bar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);padding:6px 0;cursor:pointer}
nav.bar button svg{width:22px;height:22px}
nav.bar button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.bar .add{position:relative;top:-14px}
nav.bar .add span{width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(28,92,171,.35)}
nav.bar .add svg{width:26px;height:26px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px 24px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px}.grab{display:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:14px}
.seg button{border:0;background:none;padding:10px 6px;border-radius:11px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;width:100%}
.amtrow{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 2px 8px;margin-bottom:14px}
.amtrow span{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--muted)}
.amtrow input{border:0;background:none;font-family:var(--display);font-weight:800;font-size:2.2rem;width:100%;padding:0;outline:none}
.amtrow:focus-within{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fhint{font-size:.77rem;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;gap:10px;align-items:center}
.ritem .im{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--line) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:.72rem;flex:none}
.ritem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--ink-2);cursor:pointer;font-weight:600;font-size:.88rem}
.pick input{display:none}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.on{opacity:1}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:70;flex-direction:column;gap:10px;color:var(--muted);font-size:.9rem}
.loading.off{display:none}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:.84rem;background:var(--warn-soft);color:var(--warn)}
.banner:empty{display:none}
.hdr-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
.icon-btn svg{width:20px;height:20px}
.pin{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));color:var(--hero-ink);
  background:radial-gradient(120% 90% at 100% 0%, var(--hero) 0%, var(--hero-2) 75%)}
.pin.on{display:flex}
.pin .logo{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--gold)}
.pin h2{font-size:1.35rem;font-weight:800;text-align:center}
.pin p{margin:0;color:var(--hero-mut);font-size:.88rem;text-align:center;max-width:300px}
.dots{display:flex;gap:14px;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hero-mut)}
.dots i.f{background:var(--gold);border-color:var(--gold)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.09);color:var(--hero-ink);font-family:var(--display);font-size:1.6rem;font-weight:600;cursor:pointer}
.pad button:active{background:rgba(255,255,255,.2)}
.pad button.ghost{background:none;font-size:.9rem;font-family:var(--body)}
.pin .err{min-height:1.2em;color:#ffb4a8;font-size:.86rem}
.pin .tip2{font-size:.78rem;color:var(--hero-mut);text-align:center;max-width:300px}
.loading .retry{display:none}
.loading.err .spin{display:none}
.loading.err .retry{display:inline-flex}
@media (max-width:400px){.hero .bal{font-size:2rem}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="spin"></div><span id="loadMsg" style="text-align:center;max-width:300px;padding:0 20px">Memuatkan rekod…</span><button class="btn pri retry" data-act="retry">Cuba lagi</button></div>
<div class="pin" id="pin" aria-live="polite">
  <div class="logo">RM</div>
  <h2 id="pinTitle">Masukkan PIN</h2>
  <p id="pinSub">PIN 6 digit untuk buka rekod kau.</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<script>
const RELIEFS = [

  {k:'sports', g:'Gaya hidup', n:'Sukan', s:'Sukan', cap:1000,

  {k:'lifeins', g:'Simpanan & insurans', n:'Insurans hayat / takaful keluarga', s:'Insurans hayat', cap:3000,

  {k:'epf', g:'Simpanan & insurans', n:'KWSP (wajib & sukarela)', s:'KWSP', cap:4000},
  {k:'medins', g:'Simpanan & insurans', n:'Insurans pendidikan & perubatan', s:'Insurans perubatan', cap:4000},
  {k:'prs', g:'Simpanan & insurans', n:'PRS & anuiti tertangguh', s:'PRS', cap:3000},

    hint:'Jumlah simpan tahun ini tolak pengeluaran tahun ini.'},
  {k:'housing', g:'Rumah', n:'Faedah pinjaman rumah pertama', s:'Faedah rumah', cap:7000,
    hint:'Rumah kediaman pertama, SPA ditandatangani 2025–2027. Had ikut harga rumah (tetapkan di bawah).'},
  {k:'childcare', g:'Anak', n:'Taska, tadika & pusat transit (anak 12 tahun ke bawah)', s:'Taska / tadika', cap:3000,
    hint:'Mulai YA2026 termasuk pusat jagaan harian & transit selepas sekolah berdaftar.'},
  {k:'breast', g:'Anak', n:'Peralatan penyusuan susu ibu', s:'Penyusuan', cap:1000,
    hint:'Ibu bekerja, anak bawah 2 tahun. Sekali setiap 2 tahun.'}

const SPECIAL = {
  donation:{n:'Derma / wakaf (institusi diluluskan)', s:'Derma', hint:'Tolakan, had 10% pendapatan agregat. Perlu resit dengan no. rujukan kelulusan LHDN.'},
  zakat:{n:'Zakat / fitrah (rebat)', s:'Zakat', hint:'Rebat penuh, tolak terus dari cukai kena bayar.'},
  pcb:{n:'PCB / MTD (cukai dah dipotong)', s:'PCB', hint:'Bukan relief. Dikira sebagai cukai yang dah dibayar.'}
};
const RMAP = Object.fromEntries(RELIEFS.map(r=>[r.k,r]));
const GROUPS = ['Diri & pendidikan','Perubatan','Gaya hidup','Simpanan & insurans','Rumah','Anak'];
const FIXED = [
  {k:'self', n:'Individu (automatik)', f:s=>9000},
  {k:'spouse', n:'Pasangan tiada pendapatan / taksiran bersama', f:s=>s.spouse?4000:0},
  {k:'disSelf', n:'Individu OKU', f:s=>s.disSelf?7000:0},
  {k:'disSpouse', n:'Pasangan OKU', f:s=>s.disSpouse?6000:0},
  {k:'kU18', n:'Anak bawah 18 tahun', f:s=>2000*(s.kU18||0)},
  {k:'k18', n:'Anak 18+ (A-Level, matrikulasi, persediaan)', f:s=>2000*(s.k18||0)},
  {k:'kIPT', n:'Anak 18+ di IPT (diploma ke atas)', f:s=>8000*(s.kIPT||0)},
  {k:'kOKU', n:'Anak OKU', f:s=>8000*(s.kOKU||0)}
];
const BRACKETS = [[5000,0],[15000,.01],[15000,.03],[15000,.06],[20000,.11],[30000,.19],[300000,.25],[200000,.26],[1400000,.28],[Infinity,.30]];

const CATS = {
  out:['Makan & minum','Barang dapur','Rumah (sewa / ansuran)','Utiliti','Telefon & internet','Kereta & minyak','Tol & parking',
       'Kesihatan','Insurans & takaful','Pendidikan','Sukan & gym','Gadget & buku','Pakaian','Hiburan & langganan','Percutian',
       'Keluarga & ibu bapa','Sedekah, derma & zakat','Simpanan & pelaburan','Hutang & kad kredit','Kahwin & majlis','Lain-lain'],
  in:['Gaji / elaun pengarah','Fi pengarah','Bonus / komisen','Sewa','Freelance / sampingan','Dividen','Hadiah / pindahan','Lain-lain (bercukai)','Lain-lain (tak bercukai)'],
  ded:['KWSP','PERKESO / SIP','PCB / MTD','Zakat potongan gaji','Lain-lain potongan']
};
const NOT_TAXABLE = new Set(['Dividen','Hadiah / pindahan','Lain-lain (tak bercukai)']);
const DEFAULT_REL = {
  'Telefon & internet':'life','Gadget & buku':'life','Sukan & gym':'sports','Pendidikan':'edu','Kesihatan':'med',
  'KWSP':'epf','PERKESO / SIP':'socso','PCB / MTD':'pcb','Zakat potongan gaji':'zakat'
};
const INC_HINT = {
  'Dividen':'Dividen syarikat Malaysia biasanya dikecualikan cukai. Dividen melebihi RM100k setahun kena cukai 2%.',
  'Gaji / elaun pengarah':'Rekod gaji kasar. Masukkan KWSP, PERKESO, PCB sebagai "Potongan gaji".',
  'Hadiah / pindahan':'Tak dikira sebagai pendapatan bercukai.'
};
const MONTHS = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];


/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const RM=n=>'RM'+fmt(n);
const RM0=n=>'RM'+Math.round(+n||0).toLocaleString('en-MY');
const parseAmt=v=>{const n=parseFloat(String(v||'').replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100)/100:NaN;};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function taxOn(x){let t=0,r=Math.max(0,x);for(const[w,p]of BRACKETS){const s=Math.min(r,w);t+=s*p;r-=s;if(r<=0)break;}return t;}
const relLabel=k=>RMAP[k]?.s||SPECIAL[k]?.s||'';
const relName=k=>RMAP[k]?.n||SPECIAL[k]?.n||'';
const claimOf=t=>(t.claim!==undefined&&t.claim!==null&&t.claim!=='')?+t.claim:(+t.amount||0);
const rcpts=t=>Array.isArray(t.receipts)?t.receipts:[];
const needsRcpt=t=>t.type==='out'&&t.relief&&t.relief!=='pcb';
const keepUntil=y=>`31 Dis ${(+y)+7}`;
const isPdf=r=>String(r.type||'').includes('pdf');
const driveUrl=id=>'https://drive.google.com/file/d/'+id+'/view';
const DOC_TYPES=['Borang EA','Penyata KWSP','Penyata PERKESO','Resit zakat tahunan','Penyata pinjaman rumah','Akuan Terima e-BE','Salinan e-BE (PDF)','Notis Taksiran','Lain-lain'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2800);}
const initials=s=>String(s||'?').replace(/[^A-Za-z ]/g,' ').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'•';

/* ---------- server ---------- */
const API_URL='https://script.google.com/macros/s/AKfycbxK6_D4QfD7F7DV_s9AIK-uS0mam-Wl8zevHlBjlJbNXs-iG-Np3SAzxrRq-hAlGk26Ng/exec';
let TOKEN=null;try{TOKEN=localStorage.getItem('cf_token');}catch(_){}
function saveToken(t){TOKEN=t;try{t?localStorage.setItem('cf_token',t):localStorage.removeItem('cf_token');}catch(_){}}
async function call(body,timeout){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeout||25000);
  try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body),signal:ctl.signal,redirect:'follow'});
    const txt=await r.text();try{return JSON.parse(txt);}catch(_){throw new Error('Google belum sedia. Pastikan skrip dah di-deploy semula dengan akses "Anyone".');}}
  catch(e){if(e.name==='AbortError')throw new Error('Sambungan ke Google ambil masa terlalu lama. Semak internet dan cuba lagi.');if(e instanceof TypeError)throw new Error('Tak dapat sambung ke Google. Semak internet dan cuba lagi.');throw e;}
  finally{clearTimeout(tm);}
}
async function run(fn,...args){
  const j=await call({fn,args,token:TOKEN},(fn==='saveTx'||fn==='uploadDocs')?120000:30000);
  if(!j.ok){if(j.error==='AUTH'){saveToken(null);showPin('login');throw new Error('Sila masukkan PIN semula.');}throw new Error(j.error||'Ralat');}
  return j.data;
}
function fileToB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}
async function shrink(file){
  if(!file.type.startsWith('image/')||file.type==='image/gif'||file.size<900*1024)return file;
  try{const bmp=await createImageBitmap(file);const max=2200,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const out=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    return(out&&out.size<file.size)?new File([out],(file.name||'resit').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file;}catch(_){return file;}
}
async function packFiles(files){const out=[];for(const f0 of files){const f=await shrink(f0);out.push({name:f0.name||'resit',type:f.type||(String(f0.name).toLowerCase().endsWith('.pdf')?'application/pdf':'image/jpeg'),data:await fileToB64(f)});}return out;}

/* ---------- state ---------- */
const S={txns:[],settings:{years:{}},year:new Date().getFullYear(),view:'home',filter:'all',q:'',edit:null,type:'out',relTouched:false,files:[],formR:[],open:{},thumbs:{},thumbReq:new Set(),links:{},ready:false};
function yearSet(y){return Object.assign({spouse:false,disSelf:false,disSpouse:false,kU18:0,k18:0,kIPT:0,kOKU:0,housing:7000},(S.settings.years||{})[y]||{});}
const yearTx=y=>S.txns.filter(t=>String(t.date||'').slice(0,4)===String(y));

function calc(y){
  const tx=yearTx(y),st=yearSet(y);
  let inc=0,incTax=0,out=0,ded=0,donation=0,zakat=0,pcb=0;
  const raw={},items={},noRcpt=[],inM=Array(12).fill(0),outM=Array(12).fill(0),byCat={},byInc={};
  for(const t of tx){
    const a=+t.amount||0,m=(+String(t.date).slice(5,7)||1)-1;
    if(t.type==='in'){inc+=a;inM[m]+=a;byInc[t.cat]=(byInc[t.cat]||0)+a;if(!NOT_TAXABLE.has(t.cat))incTax+=a;continue;}
    if(t.type==='out'){out+=a;byCat[t.cat]=(byCat[t.cat]||0)+a;}else ded+=a;
    outM[m]+=a;
    const r=t.relief;if(!r)continue;const c=claimOf(t);
    if(r==='donation')donation+=c;else if(r==='zakat')zakat+=c;else if(r==='pcb')pcb+=c;
    else if(RMAP[r]){raw[r]=(raw[r]||0)+c;(items[r]=items[r]||[]).push(t);}
    if(needsRcpt(t)&&!rcpts(t).length)noRcpt.push(t);
  }
  const rows={};
  for(const R of RELIEFS){const cap=R.k==='housing'?(+st.housing||7000):R.cap;rows[R.k]={raw:raw[R.k]||0,cap,allowed:0,items:items[R.k]||[]};}
  for(const R of RELIEFS)if(R.parent)rows[R.k].allowed=Math.min(rows[R.k].raw,rows[R.k].cap);
  for(const R of RELIEFS)if(!R.parent){let sum=rows[R.k].raw,gross=rows[R.k].raw;for(const C of RELIEFS)if(C.parent===R.k){sum+=rows[C.k].allowed;gross+=rows[C.k].raw;}rows[R.k].sum=sum;rows[R.k].gross=gross;rows[R.k].allowed=Math.min(sum,rows[R.k].cap);}
  const variable=RELIEFS.filter(R=>!R.parent).reduce((s,R)=>s+rows[R.k].allowed,0);
  const fixed=FIXED.map(f=>({...f,amt:f.f(st)})).filter(f=>f.amt>0);
  const fixedTotal=fixed.reduce((s,f)=>s+f.amt,0);
  const donAllowed=Math.min(donation,incTax*0.10),total=Math.max(0,incTax-donAllowed),reliefTotal=fixedTotal+variable;
  const charge=Math.max(0,total-reliefTotal),tax=taxOn(charge),rebate=charge<=35000?Math.min(400,tax):0;
  const zak=Math.min(zakat,Math.max(0,tax-rebate)),net=Math.max(0,tax-rebate-zak);
  const saved=Math.max(0,taxOn(Math.max(0,total-9000))-tax);
  const capSum=RELIEFS.filter(R=>!R.parent&&rows[R.k].raw+(rows[R.k].sum||0)>0).reduce((s,R)=>s+rows[R.k].cap,0);
  return{tx,st,inc,incTax,out,ded,net,cash:inc-out-ded,inM,outM,byCat,byInc,rows,variable,fixed,fixedTotal,donation,donAllowed,total,reliefTotal,charge,tax,rebate,zakat,zak,pcb,bal:net-pcb,saved,noRcpt,capSum};
}

function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,2,2.5,5,10]){if(m*p>=v)return m*p;}return 10*p;}
const shortRM=v=>v>=1000?'RM'+(v/1000).toLocaleString('en-MY',{maximumFractionDigits:1})+'k':'RM'+Math.round(v);
function barPath(x,y,w,h){if(h<=0.5)return'';const r=Math.min(4,w/2,h);return`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;}
function drawChart(c){
  const box=$('#chartbox'),svg=$('#chart');if(!box)return;
  const W=Math.max(300,box.clientWidth||600),H=200,pl=46,pr=4,pt=10,pb=24;
  const max=niceMax(Math.max(...c.inM,...c.outM)),iw=W-pl-pr,ih=H-pt-pb,gw=iw/12,bw=Math.max(4,Math.min(13,(gw-8)/2));
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,y=pt+ih-ih*i/4;
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${shortRM(v)}</text>`;}
  for(let m=0;m<12;m++){const cx=pl+m*gw+gw/2,h1=c.inM[m]/max*ih,h2=c.outM[m]/max*ih;
    g+=`<path d="${barPath(cx-bw-1,pt+ih-h1,bw,h1)}" fill="var(--in)"/><path d="${barPath(cx+1,pt+ih-h2,bw,h2)}" fill="var(--out)"/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${MONTHS[m]}</text><rect x="${pl+m*gw}" y="${pt}" width="${gw}" height="${ih}" fill="transparent" data-m="${m}" style="cursor:pointer"/>`;}
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--muted)" stroke-width="1"/>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=g;
  const tip=$('#tip');
  const show=e=>{const m=+e.target.dataset.m;if(isNaN(m))return;const net=c.inM[m]-c.outM[m];
    tip.innerHTML=`<b>${MONTHS[m]} ${S.year}</b><br>Masuk ${RM(c.inM[m])}<br>Keluar ${RM(c.outM[m])}<br>Bersih ${net<0?'−':''}${RM(Math.abs(net))}`;
    const sc=box.clientWidth/W;let x=(pl+m*gw+gw/2)*sc;x=Math.min(Math.max(x,70),box.clientWidth-70);tip.style.left=x+'px';tip.style.top=(pt*sc+4)+'px';tip.classList.add('on');};
  svg.querySelectorAll('rect[data-m]').forEach(r=>{r.addEventListener('pointerenter',show);r.addEventListener('click',show);});
  svg.addEventListener('pointerleave',()=>tip.classList.remove('on'));
}
function filteredTx(c){
  const q=S.q.trim().toLowerCase();
  return c.tx.filter(t=>{
    if(S.filter==='in'&&t.type!=='in')return false;if(S.filter==='out'&&t.type!=='out')return false;if(S.filter==='ded'&&t.type!=='ded')return false;
    if(S.filter==='claim'&&!(t.relief&&t.relief!=='pcb'))return false;
    if(S.filter==='norcpt'&&!(needsRcpt(t)&&!rcpts(t).length))return false;
    if(q&&!(`${t.desc||''} ${t.cat||''} ${t.note||''} ${relLabel(t.relief)}`.toLowerCase().includes(q)))return false;return true;
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
}

function relRow(R,c,isSub){

function fillCats(){const sel=$('#fCat'),cur=sel.value;sel.innerHTML=CATS[S.type].map(c=>`<option>${esc(c)}</option>`).join('');if(CATS[S.type].includes(cur))sel.value=cur;}

  h+=`<optgroup label="Tolakan & rebat">${Object.entries(SPECIAL).map(([k,v])=>`<option value="${k}">${esc(v.n)}</option>`).join('')}</optgroup>`;$('#fRel').innerHTML=h;

function openForm(t){
  S.edit=t||null;S.files=[];S.formR=t?rcpts(t).map(r=>({...r})):[];S.relTouched=!!t;S.confirmDel=false;S.type=t?.type||'out';

  $('#fMethod').value=t?.method||'';$('#fNote').value=t?.note||'';$('#fFile').value='';

function closeForm(){$('#overlay').classList.remove('on');$('#overlay').setAttribute('aria-hidden','true');S.edit=null;}
async function saveForm(e){
  e.preventDefault();
  const amount=parseAmt($('#fAmt').value);if(!(amount>0)){toast('Masukkan jumlah yang betul.');$('#fAmt').focus();return;}
  const date=$('#fDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('Pilih tarikh.');return;}
  const relief=S.type==='in'?'':$('#fRel').value;
  let claim=$('#fClaim').value.trim()===''?null:parseAmt($('#fClaim').value);if(claim!==null&&!(claim>=0))claim=null;if(claim!==null&&claim>amount)claim=amount;
  const btn=$('#saveBtn');btn.disabled=true;btn.textContent=S.files.length?'Muat naik resit…':'Menyimpan…';
  try{
    const prev=S.edit||{};
    const tx={id:prev.id||'',type:S.type,amount,date,cat:$('#fCat').value,desc:$('#fDesc').value.trim(),relief:relief||'',
      reliefName:relName(relief),reliefShort:relLabel(relief),typeLabel:{in:'Masuk',out:'Keluar',ded:'Potongan gaji'}[S.type],
      claim:(relief&&relief!=='pcb')?claim:null,method:S.type==='out'?$('#fMethod').value:'',note:$('#fNote').value.trim(),
      receipts:S.type==='ded'?[]:S.formR.slice(),createdAt:prev.createdAt||0};
    const files=S.type==='ded'?[]:await packFiles(S.files);
    const saved=await run('saveTx',tx,files);
    const i=S.txns.findIndex(x=>x.id===saved.id);if(i>=0)S.txns[i]=saved;else S.txns.push(saved);
    const y=+date.slice(0,4);if(y!==S.year)S.year=y;
    closeForm();toast(prev.id?'Rekod dikemas kini.':'Rekod disimpan.');render();
  }catch(err){toast('Tak dapat simpan: '+((err&&err.message)||'cuba lagi'));}
  finally{btn.disabled=false;btn.textContent='Simpan';}
}
async function delCurrent(){
  if(!S.edit)return;
  if(!S.confirmDel){S.confirmDel=true;$('#delBtn').textContent='Tekan lagi untuk padam';return;}
  try{await run('deleteTx',S.edit.id);S.txns=S.txns.filter(x=>x.id!==S.edit.id);closeForm();toast('Rekod dipadam. Fail resit kekal dalam Drive.');render();}
  catch(e){toast('Tak dapat padam. Cuba lagi.');}
}

function summaryRows(c){
  const rows=[['Ringkasan cukai YA'+S.year,'',''],['Dijana',todayStr(),''],['','',''],['Perkara','Had (RM)','Boleh claim (RM)']];
  c.fixed.forEach(f=>rows.push([f.n,f.amt,f.amt]));
  RELIEFS.forEach(R=>{const r=c.rows[R.k];if(!r.raw&&!(R.parent?0:r.sum))return;rows.push([(R.parent?'   ↳ ':'')+R.n,r.cap,r.allowed]);});
  rows.push(['','',''],['Jumlah relief','',c.reliefTotal],['Pendapatan bercukai','',c.incTax],['Derma diluluskan','',c.donAllowed],['Pendapatan bercukai bersih','',c.charge],
    ['Cukai ikut kadar','',c.tax],['Rebat individu','',c.rebate],['Rebat zakat','',c.zak],['Cukai kena bayar','',c.net],['PCB dah dibayar','',c.pcb],[c.bal>0?'Perlu bayar lagi':'Bayaran balik','',Math.abs(c.bal)],
    ['','',''],['Simpan rekod & resit sehingga',keepUntil(S.year),'']);
  return rows;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-view],[data-go],[data-filter],[data-edit],[data-open],[data-step],[data-act],[data-type],[data-rm-r],[data-rm-f],[data-copy],[data-rm-doc],[data-open-file]');
  if(!el)return;
  if(el.dataset.view){S.view=el.dataset.view;render();window.scrollTo(0,0);return;}
  if(el.dataset.go){S.view=el.dataset.go;render();window.scrollTo(0,0);return;}
  if(el.dataset.filter){S.filter=el.dataset.filter;render();return;}
  if(el.dataset.edit){const t=S.txns.find(x=>x.id===el.dataset.edit);if(t)openForm(t);return;}
  if(el.dataset.openFile){window.open(driveUrl(el.dataset.openFile),'_blank');return;}
  if(el.dataset.open){S.open[el.dataset.open]=!S.open[el.dataset.open];render();return;}
  if(el.dataset.step){const k=el.dataset.step,v=Math.max(0,Math.min(12,(yearSet(S.year)[k]||0)+(+el.dataset.d)));saveSetting(k,v);return;}
  if(el.dataset.type){S.type=el.dataset.type;fillCats();if(!S.relTouched)$('#fRel').value=DEFAULT_REL[$('#fCat').value]||'';syncForm();return;}
  if(el.dataset.rmR!==undefined){S.formR.splice(+el.dataset.rmR,1);renderReceipt();return;}
  if(el.dataset.rmF!==undefined){S.files.splice(+el.dataset.rmF,1);renderReceipt();return;}
  if(el.dataset.copy!==undefined){const v=el.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Disalin: '+v)).catch(()=>toast('Taip manual: '+v));return;}
  if(el.dataset.rmDoc!==undefined){if(el.dataset.confirm!=='1'){el.dataset.confirm='1';el.textContent='Tekan lagi';return;}const docs=(yearSet(S.year).docs||[]).slice();docs.splice(+el.dataset.rmDoc,1);saveSetting('docs',docs);toast('Dibuang dari senarai. Fail kekal dalam Drive.');return;}
  const a=el.dataset.act;
  if(a==='retry'){boot();return;}
  if(a==='lock'){saveToken(null);S.txns=[];showPin('login');return;}
  if(a==='chgpin'){showPin('old');return;}
  if(a==='add')openForm(null);else if(a==='close')closeForm();else if(a==='del')delCurrent();
  else if(a==='doc-up')uploadDoc();
  else if(a==='filed'){const d=$('#filedDate').value,r=$('#filedRef').value.trim();if(!d){toast('Pilih tarikh hantar.');return;}saveSetting('filed',{date:d,ref:r});toast('Status e-Filing disimpan.');}
  else if(a==='unfile')saveSetting('filed',null);
  else if(a==='summary'){const c=calc(S.year);run('writeSummary',S.year,summaryRows(c)).then(()=>toast('Ringkasan disimpan dalam tab "Ringkasan YA'+S.year+'".')).catch(()=>toast('Tak dapat simpan ringkasan.'));}
});
document.addEventListener('change',e=>{

  if(t.id==='yearSel'){S.year=+t.value;render();}
  else if(t.dataset.set){saveSetting(t.dataset.set,t.checked);}
  else if(t.dataset.setSel){saveSetting(t.dataset.setSel,+t.value);}
  else if(t.id==='fCat'){if(!S.relTouched)$('#fRel').value=DEFAULT_REL[t.value]||'';syncForm();}
  else if(t.id==='fRel'){S.relTouched=true;syncForm();}
  else if(t.id==='fFile'){S.files.push(...(t.files?[...t.files]:[]));t.value='';renderReceipt();}
  else if(t.id==='docFile'){const n=t.files?t.files.length:0;$('#docPicked').textContent=n?`${n} fail dipilih: `+[...t.files].map(f=>f.name).join(', '):'';}

document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});

/* ---------- PIN ---------- */
const isStandalone=()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const P={mode:'login',buf:'',first:'',old:'',busy:false};
const PIN_TXT={
  set:['Cipta PIN','Pilih PIN 6 digit. Kau guna PIN ni setiap kali buka app.'],
  confirm:['Sahkan PIN','Masukkan PIN yang sama sekali lagi.'],
  login:['Masukkan PIN','PIN 6 digit untuk buka rekod kau.'],
  old:['PIN sekarang','Masukkan PIN lama dulu.'],
  newp:['PIN baru','Pilih PIN 6 digit yang baru.'],
  newc:['Sahkan PIN baru','Masukkan PIN baru sekali lagi.']};
function showPin(mode,err){
  P.mode=mode;P.buf='';$('#pinTitle').textContent=PIN_TXT[mode][0];$('#pinSub').textContent=PIN_TXT[mode][1];
  $('#pinErr').textContent=err||'';drawDots();$('#pin').classList.add('on');$('#loading').classList.add('off');
  $('#installTip').textContent=isStandalone()?'':'Tip: dalam Safari tekan Share → Add to Home Screen untuk pasang app ini.';
  if(mode==='old'||mode==='newp'||mode==='newc'){$('#installTip').innerHTML='<button class="btn sm" data-act="pincancel" style="background:transparent;color:var(--hero-ink);border-color:rgba(255,255,255,.25)">Batal</button>';}
}
function hidePin(){$('#pin').classList.remove('on');}
function drawDots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<P.buf.length));}
function pinErr(m){$('#pinErr').textContent=m;const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');P.buf='';drawDots();}
async function pinDone(){
  const v=P.buf;P.busy=true;$('#pinErr').textContent='';
  try{
    if(P.mode==='set'){P.first=v;showPin('confirm');}
    else if(P.mode==='confirm'){if(v!==P.first){P.first='';showPin('set','PIN tak sama. Cuba sekali lagi.');return;}
      const j=await call({fn:'setPin',pin:v});if(!j.ok)throw new Error(j.error);saveToken(j.data.token);hidePin();await loadAll().catch(e=>loadErr(e.message));}
    else if(P.mode==='login'){const j=await call({fn:'login',pin:v});
      if(!j.ok){if(j.error==='NOPIN'){showPin('set');return;}pinErr(j.error);return;}saveToken(j.data.token);hidePin();await loadAll().catch(e=>loadErr(e.message));}
    else if(P.mode==='old'){P.old=v;showPin('newp');}
    else if(P.mode==='newp'){P.first=v;showPin('newc');}
    else if(P.mode==='newc'){if(v!==P.first){showPin('newp','PIN baru tak sama. Cuba lagi.');return;}
      const j=await call({fn:'changePin',token:TOKEN,oldPin:P.old,pin:v});P.old='';
      if(!j.ok){showPin('old',j.error==='AUTH'?'Sila log masuk semula.':j.error);return;}saveToken(j.data.token);hidePin();toast('PIN ditukar.');}
  }catch(e){pinErr(e.message||'Ralat');}
  finally{P.busy=false;}
}
document.getElementById('pad').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b||P.busy)return;const k=b.dataset.k;
  if(k==='b')P.buf=P.buf.slice(0,-1);else if(k==='c')P.buf='';else if(P.buf.length<6)P.buf+=k;
  drawDots();if(P.buf.length===6)setTimeout(pinDone,120);
});
document.addEventListener('keydown',e=>{if(!$('#pin').classList.contains('on')||P.busy)return;
  if(/^\d$/.test(e.key)&&P.buf.length<6){P.buf+=e.key;drawDots();if(P.buf.length===6)setTimeout(pinDone,120);}
  else if(e.key==='Backspace'){P.buf=P.buf.slice(0,-1);drawDots();}});
document.addEventListener('click',e=>{if(e.target.closest('[data-act="pincancel"]')){hidePin();}});

async function loadAll(){

async function boot(){
  const h=new Date().getHours();
  $('#hi').textContent=(h<12?'Selamat pagi':h<15?'Selamat tengah hari':h<19?'Selamat petang':'Selamat malam')+', Aufa';
  const L=$('#loading');L.classList.remove('off','err');$('#loadMsg').textContent='Menyambung ke Google…';
  try{
    if(TOKEN){try{await loadAll();return;}catch(e){if(!TOKEN)return;throw e;}}
    const st=await call({fn:'status'});
    if(!st.ok)throw new Error(st.error||'Ralat');
    showPin(st.data.hasPin?'login':'set');
  }catch(e){loadErr(e.message||'Tak dapat sambung.');}
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
boot();
</script>
